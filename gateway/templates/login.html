<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gateway Login</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
<div class="login-card">
  <h2>IoT Gateway Login</h2>
  {% if error %}
  <p class="error-msg">{{ error }}</p>
  {% endif %}
  <form method="POST" action="/login">
    <div class="form-group">
      <label>Username</label>
      <input type="text" name="username" value="admin" required autofocus>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" value="admin" required>
    </div>
    <button type="submit" class="primary-btn">Log In</button>
  </form>
  <p class="hint">Default credentials: <code>admin / admin</code></p>
</div>
</body>
</html>
